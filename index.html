<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DevHabit - 习惯养成</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <header class="header">
            <h1>DevHabit</h1>
            <p>每一次坚持，都值得被看见</p>
        </header>

        <section class="habits">
            <h2>我的习惯</h2>
            <div class="habit-list">
                <article class="habit-card">
                    <div>
                        <h3>每天写代码</h3>
                        <p>连续 <strong>12</strong> 天</p>
                    </div>
                    <button class="checkin-btn">打卡</button>
                </article>
                <article class="habit-card">
                    <div>
                        <h3>阅读 30 分钟</h3>
                        <p>连续 <strong>7</strong> 天</p>
                    </div>
                    <button class="checkin-btn">打卡</button>
                </article>
                <article class="habit-card">
                    <div>
                        <h3>早起 7 点</h3>
                        <p>连续 <strong>3</strong> 天</p>
                    </div>
                    <button class="checkin-btn">打卡</button>
                </article>
            </div>
        </section>

        <section class="heatmap-section">
            <h2>过去一年的打卡记录</h2>
            <div class="heatmap" id="heatmap"></div>
        </section>
    </div>
    <script src="js/app.js"></script>
</body>

</html>
